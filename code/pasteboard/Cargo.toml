[package]
name = "clipboardx"
version = "0.1.0"
edition = "2021"
description = "Windows 全局剪切板管理器 - 类手机输入法剪切板体验"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
